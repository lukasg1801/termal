<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Terrmal - Natura w Twoim wnętrzu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Moon+Kids&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      color: #333;
    }

    nav {
      background: rgba(131, 35, 221, 0.8);
      padding: 10px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    nav a {
      margin: 0 20px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 14px;
      letter-spacing: 1px;
    }

    nav a:hover {
      color: #f4f4f4;
    }

    nav .dropdown {
      position: relative;
      display: inline-block;
    }

    nav .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f4f4f4;
      color: #333;
      width: 100vw;
      padding: 20px;
      z-index: 1;
      box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
    }

    nav .dropdown:hover .dropdown-content {
      display: block;
      height: 300px;
    }

    header {
      background: #8323dd;
      color: white;
      text-align: center;
      padding: 50px 20px;
    }

    header .logo {
      max-width: 200px;
      width: 100%;
      height: auto;
    }

    .category-section {
      position: relative;
      height: 100vh;
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 0;
      background-attachment: fixed;
    }

    .category-section .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    .product {
      background: white;
      border-radius: 10px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: transform 0.3s ease;
      margin: 0 auto;
      cursor: pointer;
      overflow: hidden;
    }

    .product:hover {
      transform: scale(1.03);
    }

    .product img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 5px;
    }

    .product h3 {
      padding: 10px 0;
      margin: 0;
      font-size: 1.2em;
    }

    .product a {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background: #2c0055;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .product a:hover {
      background: #f4f4f4;
      color: #2c0055;
      border: 1px solid #2c0055;
    }

    .section {
      padding: 40px 20px;
      max-width: 1000px;
      margin: auto;
    }

    .image-section {
      width: 100%;
      height: 400px;
      background-size: cover;
      background-position: center;
      margin-top: 20px;
    }

    .image-fill {
      width: 100%;
      height: 400px;
      background-image: url('images/ChatGPT\ Image\ 11\ lip\ 2025\,\ 02_37_53.png');
      background-size: cover;
      background-position: center;
      margin-bottom: 20px;
    }

    footer p {
      margin: 5px;
      font-size: 0.8em;
      text-align: center;
    }

    @media screen and (max-width: 768px) {
      nav {
        flex-direction: column;
      }

      nav a {
        margin: 10px 0;
      }

      .product {
        max-width: 100%;
      }

      header {
        padding: 30px 20px;
      }

      header .logo {
        max-width: 150px;
      }

      .category-section {
        height: 70vh;
      }
    }
  </style>
</head>
<body>
